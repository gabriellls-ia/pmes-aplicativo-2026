<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14171C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PMES Estudos" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>PMES Estudos 2026</title>
    <style>
      html,body{margin:0;min-height:100%;background:#14171C;color:#EDEBE4;font-family:system-ui,sans-serif}
      #boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
      #boot-card{width:min(680px,100%);box-sizing:border-box;padding:24px;border:1px solid #313945;border-radius:16px;background:#1D222A}
      #boot a{display:block;margin-top:10px;padding:14px;border:1px solid #313945;border-radius:11px;background:#262C36;color:#EDEBE4;text-decoration:none;font-weight:700}
      #boot p{color:#98A1B0;line-height:1.55}
    </style>
    <script>
      // Remove registrations/caches from the old PWA shell so it cannot keep serving stale JS.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}).catch(function(){});
      }
      if ('caches' in window) {
        caches.keys().then(function(keys){return Promise.all(keys.map(function(k){return caches.delete(k);}));}).catch(function(){});
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div id="boot-card">
          <strong>PMES • ESTUDOS 2026</strong>
          <h1>Aplicativo de Estudos</h1>
          <p>Iniciando o aplicativo. Se a tela principal não carregar, os simulados continuam acessíveis:</p>
          <a href="?rodada=1">Abrir Rodada 1 • 80 questões</a>
          <a href="?rodada=2">Abrir Rodada 2 • 80 questões</a>
          <a href="?rodada=3">Abrir Rodada 3 • 80 questões</a>
        </div>
      </div>
    </div>
    <noscript>
      <div style="padding:24px">Este aplicativo precisa de JavaScript ativado.</div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
